---
- name: Setup Tomcat10 & Deploy VProfile Artifact
  hosts: appsrvgrp
  become: yes
  vars:
    nexus_ip: "172.31.89.246"
    nexus_repo: "vprofile-release"
    nexus_download_url: "http://{{ nexus_ip }}:8081/service/rest/v1/search/assets/download?repository={{ nexus_repo }}&maven.groupId=com.vprofile&maven.artifactId=vprofile&maven.extension=war&sort=version"
    tomcat_home: "/usr/local/tomcat10"
    timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}_{{ ansible_date_time.minute }}"

  tasks:
    - name: Download latest VProfile WAR artifact from Nexus
      get_url:
        url: "{{ nexus_download_url }}"
        dest: "/tmp/vprofile.war"
        mode: '0644'
        force: yes
      register: war_download
      tags:
        - deploy

    - name: Check if existing ROOT webapp exists
      stat:
        path: "{{ tomcat_home }}/webapps/ROOT"
      register: root_stat
      tags:
        - deploy

    - name: Stop Tomcat service before deployment
      service:
        name: tomcat
        state: stopped
      tags:
        - deploy

    - name: Backup existing ROOT application if present
      archive:
        path: "{{ tomcat_home }}/webapps/ROOT"
        dest: "/opt/ROOT_backup_{{ timestamp }}.tgz"
      when: root_stat.stat.exists
      tags:
        - deploy

    - name: Clean up old ROOT directory and ROOT.war
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ tomcat_home }}/webapps/ROOT"
        - "{{ tomcat_home }}/webapps/ROOT.war"
      tags:
        - deploy

    - name: Deploy new VProfile artifact as ROOT.war
      copy:
        src: "/tmp/vprofile.war"
        dest: "{{ tomcat_home }}/webapps/ROOT.war"
        remote_src: yes
        owner: tomcat
        group: tomcat
        mode: '0644'
      tags:
        - deploy

    - name: Start Tomcat 10 service
      service:
        name: tomcat
        state: started
      tags:
        - deploy

    - name: Wait for Tomcat to extract ROOT.war into ROOT directory
      wait_for:
        path: "{{ tomcat_home }}/webapps/ROOT"
        state: present
        timeout: 60
      tags:
        - deploy
